services:
  bordbuch:
    build: .
    image: bordbuch:latest
    container_name: bordbuch
    restart: unless-stopped
    ports:
      - "8080:8080"          # links: Port auf der Synology, frei wählbar
    environment:
      DEFAULT_TZ: Europe/Zurich   # Zeitzone für Einträge ohne eigene Zeitzone
      MAX_UPLOAD_MB: 25           # max. Größe pro Dokument
      BACKUP_KEEP: 14             # Anzahl täglicher DB-Backups in /data/backups
      # Dokumente automatisch zuordnen (KI). Die Werte kommen aus der Datei .env neben dieser Datei,
      # siehe README. Ohne Schlüssel ist die Funktion aus, der Rest läuft normal.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      # Push für die iPhone-App (APNs). Werte aus der .env, siehe README. Ohne Schlüssel ist nur dieser Push aus.
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-de.theoldphilip.Reisebuch}
      APNS_SANDBOX: ${APNS_SANDBOX:-}
    volumes:
      - ./data:/data              # Datenbank, Uploads, Backups
    # Auf der Synology: UID/GID des DSM-Benutzers, dem der Ordner ./data gehört
    # (per SSH mit `id <benutzer>` ermitteln), z. B.:
    # user: "1026:100"
